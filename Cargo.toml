[package]
name = "smart-tv-toolkit"
version = "0.1.0"
edition = "2024"
description = "Manage smart TVs from your computer: device info, apps, performance, settings and more."
license = "AGPL-3.0-only"
repository = "https://github.com/Some1sm/smart-tv-toolkit"

[dependencies]
adb_client = { version = "3.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
iced = { version = "0.14", features = ["tokio", "image"] }
mdns-sd = "0.21"
open = "5"
rfd = "0.17"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "net"] }
ureq = "3"

[build-dependencies]
winresource = "0.1"

# Small, fast release builds: one codegen unit with link-time optimisation,
# no debug symbols in the shipped binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
