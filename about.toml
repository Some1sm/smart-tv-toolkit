# Licenses of the crates compiled into the app, for THIRD-PARTY-LICENSES.html
# (generated by `cargo about generate about.hbs`; see .github/workflows/release.yml).
# Every license here is compatible with distributing the app under AGPL-3.0.
accepted = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# Only what ships: skip build tools and test-only crates.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
