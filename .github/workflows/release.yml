name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build
# Windows and macOS packages and create a draft GitHub release with them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html

  windows:
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: licenses
      - run: .\scripts\package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: licenses
      - run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # A draft, so the release notes can be checked before publishing.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/THIRD-PARTY-LICENSES.html
